# Publish Documentation to GitHub Pages

# IMPORTANT: Before the first run, execute locally from the repo root:
#   quarto publish gh-pages
# Make sure the _publish.yml is generated (it points to the doc/ project).
# Also ensure GitHub Settings > Actions > "Workflow permissions"
# is set to "Read and write permissions".

name: Publish Documentation

on:
  push:
    branches: [main]
    paths:
      - 'doc/**'
      - '.github/workflows/publish-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: doc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
