---
# Build & Push Metadata Scrubber → GHCR
#
# main / tags v* : images :latest (appli déployée par deploy/).
# Branche refactor/use-api, ou lancement manuel sur une autre branche : image
# :v2 seulement, déployée à part par deploy/v2 (la V1 n'est pas touchée).

name: Build & Push

on:
  push:
    branches: [ main, refactor/use-api ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/inseefrlab/metadata-scrubber:${{ github.sha }}
            ghcr.io/inseefrlab/metadata-scrubber:latest
      - name: Build & push scrubber-check
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.check
          push: true
          tags: |
            ghcr.io/inseefrlab/scrubber-check:${{ github.sha }}
            ghcr.io/inseefrlab/scrubber-check:latest

  build-push-v2:
    if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (V2)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/inseefrlab/metadata-scrubber:v2
            ghcr.io/inseefrlab/metadata-scrubber:v2-${{ github.sha }}
