[project]
name = "metadata-scrubber"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.0",
    "jinja2>=3.1.6",
    "lxml>=6.1.1",
    "numpy>=2.4.6",
    "openai>=2.41.1",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "s3fs>=2026.6.0",
    "sse-starlette>=3.4.5",
    "tqdm>=4.68.2",
    "uvicorn>=0.49.0",
]

[project.scripts]
scrubber = "main:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "rdflib>=7.6.0",
    "pytest>=8.0.0",
    "ruff>=0.15.20",
]
app = [
    "streamlit>=1.40.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

