[project]
name = "codelist-dedup"
version = "0.1.0"
description = "Dédoublonnage incrémental des listes de codes DDI 3.3 (RMéS)"
readme = "README.md"
authors = [
    { name = "h4njlg", email = "cedric.couralet@insee.fr" }
]
requires-python = ">=3.13"
dependencies = [
    "lxml>=6.1.1",
    "numpy>=2.4.6",
    "openai>=2.41.1",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "tqdm>=4.68.2",
]

[project.scripts]
codelist-dedup = "codelist_dedup.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "rdflib>=7.6.0",
]
