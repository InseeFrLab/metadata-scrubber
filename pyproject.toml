[build-system]
requires = ["uv_build>=0.6"]
build-backend = "uv_build"

[project]
name = "metadata-scrubber"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
# Dépendances de base : pipeline déterministe, client de l'API Insee et service
# de contrôle (scrubber-check, image légère). L'appli web et l'étape sémantique
# (LLM) ajoutent le groupe `web`, installé par défaut par `uv sync`.
dependencies = [
    "fastapi>=0.139.0",
    "httpx>=0.28",
    "lxml>=6.1.1",
    "python-multipart>=0.0.18",
    "s3fs>=2026.6.0",
    "uvicorn>=0.49.0",
]

[project.scripts]
scrubber = "metadata_scrubber.main:main"
scrubber-web = "metadata_scrubber.ui.server:main"
scrubber-check = "metadata_scrubber.check.cli:main"
scrubber-check-api = "metadata_scrubber.check.api:main"

[dependency-groups]
web = [
    "jinja2>=3.1.6",
    "numpy>=2.4.6",
    "openai>=2.41.1",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "sse-starlette>=3.4.5",
    "tqdm>=4.68.2",
]
dev = [
    "rdflib>=7.6.0",
    "pytest>=8.0.0",
    "ruff>=0.15.20",
]

[tool.uv]
default-groups = ["web", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

