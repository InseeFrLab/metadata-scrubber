apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: metadata-scrubber-v2
  namespace: projet-metadonnees-rmes
  annotations:
    # SSE reste ouvert longtemps
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: metadata-scrubber-v2.lab.sspcloud.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: metadata-scrubber-v2
                port: { number: 80 }
