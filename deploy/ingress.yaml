apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metadata-scrubber
  namespace: projet-metadonnees-rmes
  annotations:
    # SSE reste ouvert longtemps
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Upload de fichiers XML
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  rules:
    # Hostname choisi sous le wildcard *.lab.sspcloud.fr
    - host: metadata-scrubber.lab.sspcloud.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: metadata-scrubber
                port: { number: 80 }